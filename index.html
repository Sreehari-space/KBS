<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="KBS — offline billing for small stores" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>KBS</title>
    <script>
      // Applied before first paint so the app doesn't flash white on a dark
      // device. This is the ONE thing localStorage is used for (doc 07, D10) —
      // it must be synchronous, and IndexedDB is not.
      try {
        if (localStorage.getItem('kbs-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {
        /* private mode with storage disabled — ignore, the app warns later */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
