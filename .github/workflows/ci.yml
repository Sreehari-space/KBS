name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cheapest check first, and the only one whose failures are mechanical:
      # `npm run format` fixes every one of them.
      - name: Formatting
        run: npm run format:check

      # Typecheck next: it catches the widest class of mistakes fastest.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Vercel builds independently, but a broken build should fail the PR
      # rather than surfacing as a failed deployment.
      - name: Build
        run: npm run build
